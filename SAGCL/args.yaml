DEFAULT: &DEFAULT
  black_list: [4,5,6]
  num_gpus_total: 8
  num_gpus_to_use: 1
  verbose: 2
  save_plot: False
  val_interval: 1

SUGRL: &SUGRL
  model_name: SUGRL
  <<: *DEFAULT

SUGRL-Cora: &SUGRL-Cora
  <<: *SUGRL
  black_list: [4,5,6]
  lr: 0.005
  out_heads: 1
  task_type: Node_Transductive
  val_interval: 1

SUGRL-Cora-classification: &SUGRL-Cora-E
  <<: *SUGRL-Cora
  epochs: 1000
  dim: 256
  dim_x: 4
  w_loss1: 10
  w_loss2: 10
  w_loss3: 1
  cfg : [512, 256]
  margin1: 0.9 # 1.1
  margin2: 0.1  #0.1
  NN: 4
  num1: 100
  wd: 0.005
  weight_decay: 0.0
  dropout: 0.3
  w_loss_c: 0.05
SUGRL-Cora-clu: &SUGRL-Cora-clu
  <<: *SUGRL-Cora
  epochs: 2000
  dim: 32
  cfg : [512, 32]
  w_loss1: 20
  w_loss2: 20
  w_loss3: 1
  margin1: .5
  margin2: 0.4
  NN: 2
  num1: 100
  wd: 0.005
  dropout: 0.4
  weight_decay: 0.00005

SUGRL-Cora-link: &SUGRL-Cora-link
  <<: *SUGRL-Cora
  epochs: 1000
  dim: 256
  dim_x: 4
  w_loss1: 10
  w_loss2: 10
  w_loss3: 1
  cfg: [ 512, 256 ]
  margin1: 0.1 # 1.1
  margin2: 1.2  #0.1
  NN: 4
  num1: 100
  wd: 0.005
  weight_decay: 0.00005
  dropout: 0.3
  w_loss_c: 0.05
  patience: 50


